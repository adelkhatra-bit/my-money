<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Simple</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
            color: #00e676;
            font-weight: 700;
        }

        p {
            font-size: 18px;
            color: #999;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background: #00e676;
            color: #0a0a0a;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
        }

        .info {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 230, 118, 0.1);
            border-radius: 10px;
            border-left: 4px solid #00e676;
        }

        .info p {
            color: #ddd;
            font-size: 14px;
            text-align: left;
        }

        button {
            margin-top: 30px;
            padding: 15px 40px;
            background: #00e676;
            color: #0a0a0a;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #00ff7f;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 230, 118, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✓</div>
        <h1>HTML/CSS OK!</h1>
        <p>Le serveur fonctionne parfaitement</p>
        <p>Les styles CSS s'appliquent correctement</p>

        <div class="status">
            Statut: Opérationnel
        </div>

        <div class="info">
            <p><strong>Prochaine étape:</strong></p>
            <p>Si tu vois cette page, le problème vient de React ou de la configuration JavaScript.</p>
            <p>Retourne sur l'app principale et vérifie la console.</p>
        </div>

        <button onclick="window.location.href='/'">
            Retour à l'app
        </button>
    </div>

    <script>
        console.log('✅ JavaScript fonctionne!');
        console.log('✅ Timestamp:', new Date().toISOString());
        console.log('✅ User Agent:', navigator.userAgent);

        document.querySelector('button').addEventListener('click', function(e) {
            console.log('✅ Click détecté - Redirection...');
        });
    </script>
</body>
</html>
