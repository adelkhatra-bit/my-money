<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Extension Icons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1f2937;
            color: white;
        }
        .icon-preview {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        canvas {
            border: 2px solid #3b82f6;
            background: white;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <h1>🤖 AI Trading Bot - Icon Generator</h1>
    <p>Click the buttons to generate and download icons for the Chrome extension.</p>

    <div class="icon-preview">
        <div>
            <p>16x16</p>
            <canvas id="icon16" width="16" height="16"></canvas>
        </div>
        <div>
            <p>48x48</p>
            <canvas id="icon48" width="48" height="48"></canvas>
        </div>
        <div>
            <p>128x128</p>
            <canvas id="icon128" width="128" height="128"></canvas>
        </div>
    </div>

    <div>
        <button onclick="generateIcon(16)">Download 16x16</button>
        <button onclick="generateIcon(48)">Download 48x48</button>
        <button onclick="generateIcon(128)">Download 128x128</button>
        <button onclick="generateAllIcons()">Download All Icons</button>
    </div>

    <script>
        function drawIcon(ctx, size) {
            // Gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#3b82f6');
            gradient.addColorStop(1, '#2563eb');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            // Robot emoji (simplified for small sizes)
            if (size === 16) {
                // Very small - just a dot
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(6, 6, 4, 4);
            } else if (size === 48) {
                // Medium - simple robot face
                ctx.fillStyle = '#ffffff';
                // Eyes
                ctx.fillRect(14, 16, 6, 6);
                ctx.fillRect(28, 16, 6, 6);
                // Mouth
                ctx.fillRect(14, 28, 20, 4);
            } else {
                // Large - detailed robot
                ctx.fillStyle = '#ffffff';

                // Head outline
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4;
                ctx.strokeRect(32, 32, 64, 64);

                // Eyes
                ctx.fillRect(44, 48, 12, 12);
                ctx.fillRect(72, 48, 12, 12);

                // Mouth
                ctx.fillRect(44, 72, 40, 8);

                // Antennas
                ctx.fillRect(60, 24, 4, 8);
                ctx.fillRect(56, 20, 12, 4);
            }
        }

        function generateIcon(size) {
            const canvas = document.getElementById(`icon${size}`);
            const ctx = canvas.getContext('2d');

            drawIcon(ctx, size);

            // Download
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `icon${size}.png`;
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);
            });
        }

        function generateAllIcons() {
            setTimeout(() => generateIcon(16), 100);
            setTimeout(() => generateIcon(48), 300);
            setTimeout(() => generateIcon(128), 500);
        }

        // Draw previews on load
        window.onload = () => {
            [16, 48, 128].forEach(size => {
                const canvas = document.getElementById(`icon${size}`);
                const ctx = canvas.getContext('2d');
                drawIcon(ctx, size);
            });
        };
    </script>
</body>
</html>
