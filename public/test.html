<!DOCTYPE html>
<html>
<head>
  <title>Test Direct - SITE OK</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255,255,255,0.05);
      padding: 40px;
      border-radius: 12px;
      max-width: 600px;
      text-align: center;
    }
    h1 { font-size: 48px; margin: 0 0 20px 0; }
    p { font-size: 18px; margin: 10px 0; opacity: 0.9; }
    .button {
      display: inline-block;
      margin: 10px;
      padding: 12px 24px;
      background: #00ff88;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
    .info { margin: 30px 0; text-align: left; }
    .info p { font-family: monospace; }
  </style>
</head>
<body>
  <div class="card">
    <h1>✅ HTML OK</h1>
    <p>Ce fichier HTML se charge correctement.</p>
    <div class="info">
      <p><strong>Test:</strong> Static HTML</p>
      <p><strong>Time:</strong> <span id="time"></span></p>
      <p><strong>URL:</strong> <span id="url"></span></p>
    </div>
    <a href="/" class="button">→ App React (Dashboard)</a>
    <a href="/health" class="button">→ React /health</a>
  </div>
  <script>
    document.getElementById('time').textContent = new Date().toLocaleString();
    document.getElementById('url').textContent = window.location.href;
  </script>
</body>
</html>
