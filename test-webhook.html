<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test TradingView Webhook</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #0a0a0a;
            color: #ffffff;
        }
        h1 {
            color: #22c55e;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #888888;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #ffffff;
            border-radius: 4px;
        }
        button {
            background: #22c55e;
            color: #000000;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background: #16a34a;
        }
        .response {
            margin-top: 20px;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .success {
            border-left: 3px solid #22c55e;
        }
        .error {
            border-left: 3px solid #ef4444;
        }
        .url {
            background: #0a0a0a;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            color: #22c55e;
        }
    </style>
</head>
<body>
    <h1>Test TradingView Webhook</h1>

    <div class="url">
        Webhook URL: https://alsftpbjneityeyzwyzz.supabase.co/functions/v1/tradingview-webhook
    </div>

    <form id="testForm">
        <div class="form-group">
            <label>Symbol</label>
            <input type="text" id="symbol" value="MNQ" required>
        </div>

        <div class="form-group">
            <label>Timeframe (minutes)</label>
            <input type="text" id="timeframe" value="30" required>
        </div>

        <div class="form-group">
            <label>Side</label>
            <select id="side">
                <option value="LONG">LONG</option>
                <option value="SHORT">SHORT</option>
            </select>
        </div>

        <div class="form-group">
            <label>Entry Price</label>
            <input type="number" id="entry" value="21450.5" step="0.01" required>
        </div>

        <div class="form-group">
            <label>Stop Loss</label>
            <input type="number" id="sl" value="21400.0" step="0.01" required>
        </div>

        <div class="form-group">
            <label>Take Profit 1 (optional)</label>
            <input type="number" id="tp1" value="21500.0" step="0.01">
        </div>

        <div class="form-group">
            <label>Take Profit 2 (optional)</label>
            <input type="number" id="tp2" value="21550.0" step="0.01">
        </div>

        <button type="submit">Send Alert to Webhook</button>
    </form>

    <div id="response"></div>

    <script>
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                symbol: document.getElementById('symbol').value,
                timeframe: document.getElementById('timeframe').value,
                side: document.getElementById('side').value,
                entry: parseFloat(document.getElementById('entry').value),
                sl: parseFloat(document.getElementById('sl').value)
            };

            const tp1 = document.getElementById('tp1').value;
            const tp2 = document.getElementById('tp2').value;

            if (tp1) payload.tp1 = parseFloat(tp1);
            if (tp2) payload.tp2 = parseFloat(tp2);

            const responseDiv = document.getElementById('response');
            responseDiv.textContent = 'Sending...';
            responseDiv.className = 'response';

            try {
                const response = await fetch('https://alsftpbjneityeyzwyzz.supabase.co/functions/v1/tradingview-webhook', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                responseDiv.textContent = `Status: ${response.status}\n\n${JSON.stringify(data, null, 2)}`;
                responseDiv.className = response.ok ? 'response success' : 'response error';

                if (response.ok) {
                    alert('Alert sent successfully! Check your dashboard at /trading to see it.');
                }
            } catch (error) {
                responseDiv.textContent = `Error: ${error.message}`;
                responseDiv.className = 'response error';
            }
        });
    </script>
</body>
</html>
