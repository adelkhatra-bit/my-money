<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" fill="url(#grad1)" rx="24"/>

  <!-- Robot head -->
  <rect x="32" y="32" width="64" height="64" fill="none" stroke="#ffffff" stroke-width="4"/>

  <!-- Eyes -->
  <rect x="44" y="48" width="12" height="12" fill="#ffffff"/>
  <rect x="72" y="48" width="12" height="12" fill="#ffffff"/>

  <!-- Mouth -->
  <rect x="44" y="72" width="40" height="8" fill="#ffffff"/>

  <!-- Antenna -->
  <rect x="60" y="24" width="4" height="8" fill="#ffffff"/>
  <rect x="56" y="20" width="12" height="4" fill="#ffffff"/>
</svg>
